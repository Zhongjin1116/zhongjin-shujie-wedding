<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>回执 — 许忠锦 & 李姝洁婚礼</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Noto+Serif+SC:wght@300;400&family=Noto+Sans+SC:wght@300;400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="rsvp-page">

  <header class="rsvp-header">
    <a href="index.html" class="back-link">← 返回</a>
    <p class="rsvp-header-title">许忠锦 & 李姝洁 · 2025.11.13</p>
  </header>

  <main class="rsvp-main">
    <div class="rsvp-form-wrap">
      <h1 class="form-heading">婚礼回执</h1>
      <p class="form-sub">感谢您抽空填写，请在 10 月 31 日前提交。</p>

      <div id="form-container">
        <!-- Name -->
        <div class="field-group">
          <label class="field-label" for="name">您的姓名 <span class="required">*</span></label>
          <input class="field-input" type="text" id="name" placeholder="请输入您的姓名" />
        </div>

        <!-- Attendance -->
        <div class="field-group">
          <label class="field-label">是否出席 <span class="required">*</span></label>
          <div class="radio-group">
            <label class="radio-label">
              <input type="radio" name="attendance" value="yes" />
              <span>出席</span>
            </label>
            <label class="radio-label">
              <input type="radio" name="attendance" value="no" />
              <span>遗憾无法出席</span>
            </label>
          </div>
        </div>

        <!-- Guest count (shown only if attending) -->
        <div class="field-group" id="guest-count-group" style="display:none;">
          <label class="field-label" for="guest-count">出席人数（包括您本人）</label>
          <select class="field-select" id="guest-count">
            <option value="1">1 人</option>
            <option value="2">2 人</option>
            <option value="3">3 人</option>
            <option value="4">4 人及以上</option>
          </select>
        </div>

        <!-- Dietary -->
        <div class="field-group" id="dietary-group" style="display:none;">
          <label class="field-label">饮食忌口</label>
          <div class="checkbox-group">
            <label class="checkbox-label">
              <input type="checkbox" name="dietary" value="none" />
              <span>无忌口</span>
            </label>
            <label class="checkbox-label">
              <input type="checkbox" name="dietary" value="vegetarian" />
              <span>素食</span>
            </label>
            <label class="checkbox-label">
              <input type="checkbox" name="dietary" value="halal" />
              <span>清真</span>
            </label>
            <label class="checkbox-label">
              <input type="checkbox" name="dietary" value="seafood" />
              <span>海鲜过敏</span>
            </label>
            <label class="checkbox-label">
              <input type="checkbox" name="dietary" value="nut" />
              <span>坚果过敏</span>
            </label>
          </div>
        </div>

        <!-- Message -->
        <div class="field-group">
          <label class="field-label" for="message">留言（可选）</label>
          <textarea class="field-textarea" id="message" placeholder="写下您对我们的祝福..."></textarea>
        </div>

        <button class="submit-btn" id="submit-btn" onclick="submitRsvp()">提交回执</button>
        <p class="error-msg" id="error-msg"></p>
      </div>

      <!-- Success state -->
      <div id="success-container" style="display:none;" class="success-container">
        <div class="success-icon">✦</div>
        <h2 class="success-heading">感谢您的回复！</h2>
        <p class="success-body">我们已收到您的回执，期待在婚礼上见到您。</p>
        <a href="index.html" class="back-home-link">← 返回邀请函</a>
      </div>
    </div>
  </main>

  <script>
    // Show/hide fields based on attendance
    document.querySelectorAll('input[name="attendance"]').forEach(radio => {
      radio.addEventListener('change', function () {
        const attending = this.value === 'yes';
        document.getElementById('guest-count-group').style.display = attending ? 'block' : 'none';
        document.getElementById('dietary-group').style.display = attending ? 'block' : 'none';
      });
    });

    async function submitRsvp() {
      const name = document.getElementById('name').value.trim();
      const attendance = document.querySelector('input[name="attendance"]:checked');
      const errorMsg = document.getElementById('error-msg');
      errorMsg.textContent = '';

      if (!name) { errorMsg.textContent = '请填写您的姓名。'; return; }
      if (!attendance) { errorMsg.textContent = '请选择是否出席。'; return; }

      const attending = attendance.value === 'yes';
      const guestCount = attending ? document.getElementById('guest-count').value : '0';
      const dietary = attending
        ? Array.from(document.querySelectorAll('input[name="dietary"]:checked')).map(c => c.value)
        : [];
      const message = document.getElementById('message').value.trim();

      const btn = document.getElementById('submit-btn');
      btn.textContent = '提交中...';
      btn.disabled = true;

      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 12000);

      try {
        const res = await fetch('/api/rsvp', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, attending, guestCount, dietary: dietary.join(','), message }),
          signal: controller.signal
        });
        clearTimeout(timeoutId);

        if (res.ok) {
          document.getElementById('form-container').style.display = 'none';
          document.getElementById('success-container').style.display = 'block';
        } else {
          let errorDetail = '提交失败';
          try {
            const data = await res.json();
            errorDetail = data.detail || data.error || errorDetail;
          } catch (_) {}
          throw new Error(errorDetail);
        }
      } catch (e) {
        clearTimeout(timeoutId);
        errorMsg.textContent = e.name === 'AbortError'
          ? '提交超时，请稍后再试。'
          : `提交遇到问题：${e.message}`;
        btn.textContent = '提交回执';
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
