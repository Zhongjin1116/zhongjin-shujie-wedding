<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>回执 — 许忠锦 & 李姝洁婚礼</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Noto+Serif+SC:wght@300;400&family=Noto+Sans+SC:wght@300;400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="rsvp-page">

  <header class="rsvp-header">
    <a href="index.html?state=page3-rsvp" class="back-link" id="rsvp-back-link">← 返回</a>
    <p class="rsvp-header-title">许忠锦 & 李姝洁 · 2026.11.13</p>
  </header>

  <main class="rsvp-main">
    <div class="rsvp-form-wrap">
      <h1 class="form-heading">婚礼回执</h1>
      <p class="form-sub">感谢您抽空填写，请在 10 月 31 日前提交。</p>

      <div id="form-container">
        <div class="field-group">
          <label class="field-label" for="name">姓名 <span class="required">*</span></label>
          <input class="field-input" type="text" id="name" placeholder="请输入您的姓名" />
        </div>

        <div class="field-group">
          <label class="field-label" for="guest-count">出席人数 <span class="required">*</span></label>
          <select class="field-select" id="guest-count">
            <option value="1">1 人</option>
            <option value="2">2 人</option>
            <option value="3">3 人</option>
            <option value="4">4 人</option>
            <option value="5">5 人及以上</option>
          </select>
        </div>

        <div class="field-group">
          <label class="field-label" for="guest-names">请填写同行宾客姓名</label>
          <textarea class="field-textarea compact" id="guest-names" placeholder="如有同行宾客，请填写姓名"></textarea>
        </div>

        <div class="field-group">
          <label class="field-label" for="has-allergy">是否有忌口或食物过敏</label>
          <select class="field-select" id="has-allergy">
            <option value="否">否</option>
            <option value="是">是</option>
          </select>
        </div>

        <div class="field-group">
          <label class="field-label" for="allergy-detail">请填写具体的宾客忌口或过敏信息</label>
          <textarea class="field-textarea compact" id="allergy-detail" placeholder="如有忌口或过敏，请在这里说明"></textarea>
        </div>

        <div class="field-group">
          <label class="field-label" for="needs-lodging">是否需要住宿安排</label>
          <select class="field-select" id="needs-lodging">
            <option value="否">否</option>
            <option value="是">是</option>
          </select>
          <p class="field-help">对于外地的宾客，我们会根据您的安排提供一至两晚的住宿。</p>
        </div>

        <div class="field-group">
          <label class="field-label" for="lodging-detail">请填写具体的住宿信息</label>
          <textarea class="field-textarea compact" id="lodging-detail" placeholder="如需要住宿，请填写人数、到达日期或其他安排"></textarea>
        </div>

        <div class="field-group">
          <label class="field-label">*着装要求</label>
          <p class="field-help">为了能更好地契合婚礼主题，我们希望宾客优先选择柔和、自然的浅色系轻礼服出席。</p>
        </div>

        <button class="submit-btn" id="submit-btn" onclick="submitRsvp()">提交回执</button>
        <p class="error-msg" id="error-msg"></p>
      </div>

      <!-- Success state -->
      <div id="success-container" style="display:none;" class="success-container">
        <div class="success-icon">✦</div>
        <h2 class="success-heading">感谢您的回复！</h2>
        <p class="success-body">我们已收到您的回执，期待在婚礼上见到您。</p>
        <a href="index.html?state=page3-rsvp" class="back-home-link">← 返回邀请函</a>
      </div>
    </div>
  </main>

  <script>
    async function submitRsvp() {
      const name = document.getElementById('name').value.trim();
      const errorMsg = document.getElementById('error-msg');
      errorMsg.textContent = '';

      if (!name) { errorMsg.textContent = '请填写您的姓名。'; return; }

      const attending = true;
      const guestCount = document.getElementById('guest-count').value;
      const guestNames = document.getElementById('guest-names').value.trim();
      const hasAllergy = document.getElementById('has-allergy').value;
      const allergyDetail = document.getElementById('allergy-detail').value.trim();
      const needsLodging = document.getElementById('needs-lodging').value;
      const lodgingDetail = document.getElementById('lodging-detail').value.trim();
      const dietary = `${hasAllergy}${allergyDetail ? `：${allergyDetail}` : ''}`;
      const message = [
        guestNames ? `同行宾客：${guestNames}` : '',
        `需要住宿：${needsLodging}`,
        lodgingDetail ? `住宿信息：${lodgingDetail}` : '',
      ].filter(Boolean).join('\n');

      const btn = document.getElementById('submit-btn');
      btn.textContent = '提交中...';
      btn.disabled = true;

      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 12000);

      try {
        const res = await fetch('/api/rsvp', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, attending, guestCount, dietary: dietary.join(','), message }),
          signal: controller.signal
        });
        clearTimeout(timeoutId);

        if (res.ok) {
          document.getElementById('form-container').style.display = 'none';
          document.getElementById('success-container').style.display = 'block';
        } else {
          let errorDetail = '提交失败';
          try {
            const data = await res.json();
            errorDetail = data.detail || data.error || errorDetail;
          } catch (_) {}
          throw new Error(errorDetail);
        }
      } catch (e) {
        clearTimeout(timeoutId);
        errorMsg.textContent = e.name === 'AbortError'
          ? '提交超时，请稍后再试。'
          : `提交遇到问题：${e.message}`;
        btn.textContent = '提交回执';
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
