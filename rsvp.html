<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wedding Invitation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Noto+Serif+SC:wght@300;400&family=Noto+Sans+SC:wght@300;400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="rsvp-page">

  <a href="index.html?state=page3-rsvp" class="back-link rsvp-floating-back" id="rsvp-back-link" aria-label="返回邀请函">←</a>

  <main class="rsvp-main">
    <div class="rsvp-form-wrap">
      <h1 class="form-heading">RSVP</h1>
      <p class="form-sub">请在 10 月 20 日前提交</p>

      <div id="form-container">
        <div class="field-group">
          <label class="field-label" for="name">您的姓名</label>
          <input class="field-input" type="text" id="name" placeholder="请输入您的姓名" />
        </div>

        <div class="field-group">
          <label class="field-label" for="has-companion">是否有同行宾客？</label>
          <select class="field-select" id="has-companion">
            <option value="">请选择</option>
            <option value="无">无</option>
            <option value="有">有</option>
          </select>
        </div>

        <div class="field-group conditional-field" id="companion-detail-group" hidden>
          <label class="field-label" for="guest-names">同行宾客姓名</label>
          <textarea class="field-textarea compact" id="guest-names" rows="1" placeholder="如有同行宾客，请填写姓名"></textarea>
        </div>

        <div class="field-group">
          <label class="field-label" for="has-allergy">是否有食物过敏或特殊饮食需求？</label>
          <select class="field-select" id="has-allergy">
            <option value="">请选择</option>
            <option value="无">无</option>
            <option value="有">有</option>
          </select>
        </div>

        <div class="field-group conditional-field" id="allergy-detail-group" hidden>
          <label class="field-label" for="allergy-detail">请告诉我们具体的饮食需求</label>
          <textarea class="field-textarea compact" id="allergy-detail" rows="1" placeholder="如有食物过敏或特殊饮食需求，请在这里说明"></textarea>
        </div>

        <div class="field-group">
          <label class="field-label" for="needs-lodging">是否需要我们安排住宿？</label>
          <select class="field-select" id="needs-lodging">
            <option value="">请选择</option>
            <option value="不需要">不需要</option>
            <option value="需要">需要</option>
          </select>
          <p class="field-help">对于外地宾客，我们可以根据您的行程安排，提供婚礼前后一至两晚的住宿。</p>
        </div>

        <div class="field-group conditional-field" id="lodging-detail-group" hidden>
          <label class="field-label" for="lodging-detail">请填写住宿信息</label>
          <p class="field-help">请告诉我们预计入住人数及入住日期。</p>
          <textarea class="field-textarea compact" id="lodging-detail" rows="1" placeholder="示例：2 人，11 月 12 日入住，11 月 14 日离店"></textarea>
        </div>

        <div class="field-group dress-code-group">
          <div class="dress-code-head">
            <p class="dress-code-title">Dress Code / 着装建议</p>
            <img class="dress-code-swatches" src="assets/figma/dress-code/swatches.svg" alt="米白、香槟、棕色、灰粉、豆绿色块" />
          </div>
          <p class="dress-code-copy">
            推荐米白、香槟、棕色、灰粉、豆绿，柔和低饱和色系，简洁轻礼服或优雅得体的穿搭都很合适。11 月天气偏凉，也欢迎搭配毛衣、披肩、西装或大衣。<a href="assets/figma/dress-code/dress_code.png" class="dress-code-link">查看参考穿搭</a>
          </p>
        </div>

        <button class="submit-btn" id="submit-btn" onclick="submitRsvp()">确认出席 ♡</button>
        <p class="error-msg" id="error-msg"></p>
      </div>

      <!-- Success state -->
      <div id="success-container" style="display:none;" class="success-container">
        <div class="success-sparkles" aria-hidden="true">
          <img class="success-sparkle success-sparkle-large" src="assets/figma/rsvp-success/sparkle-large.png" alt="" />
          <img class="success-sparkle success-sparkle-top" src="assets/figma/rsvp-success/sparkle-top.png" alt="" />
          <img class="success-sparkle success-sparkle-vertical" src="assets/figma/rsvp-success/sparkle-vertical.png" alt="" />
          <img class="success-sparkle success-sparkle-small" src="assets/figma/rsvp-success/sparkle-small.png" alt="" />
        </div>
        <h2 class="success-heading">回执已收到<br />我们婚礼上见吧！</h2>
        <a href="index.html?state=page3-rsvp" class="back-home-link">返回邀请函</a>
      </div>
    </div>
  </main>

  <script>
    function selectedValue(id) {
      return document.getElementById(id)?.value || '';
    }

    function bindConditionalSelect(selectId, activeValue, groupId) {
      const select = document.getElementById(selectId);
      const group = document.getElementById(groupId);
      if (!select || !group) return;

      const update = () => {
        group.hidden = select.value !== activeValue;
        select.classList.toggle('is-empty', !select.value);
        select.classList.remove('field-error');
      };

      select.addEventListener('change', update);
      update();
    }

    bindConditionalSelect('has-companion', '有', 'companion-detail-group');
    bindConditionalSelect('has-allergy', '有', 'allergy-detail-group');
    bindConditionalSelect('needs-lodging', '需要', 'lodging-detail-group');

    document.querySelectorAll('.field-input, .field-select, .field-textarea').forEach((field) => {
      field.addEventListener('input', () => field.classList.remove('field-error'));
      field.addEventListener('change', () => {
        field.classList.remove('field-error');
        if (field.matches('.field-select')) {
          field.classList.toggle('is-empty', !field.value);
        }
      });
    });

    async function submitRsvp() {
      const nameInput = document.getElementById('name');
      const companionSelect = document.getElementById('has-companion');
      const allergySelect = document.getElementById('has-allergy');
      const lodgingSelect = document.getElementById('needs-lodging');
      const guestNamesInput = document.getElementById('guest-names');
      const allergyDetailInput = document.getElementById('allergy-detail');
      const lodgingDetailInput = document.getElementById('lodging-detail');
      const fields = [nameInput, companionSelect, allergySelect, lodgingSelect, guestNamesInput, allergyDetailInput, lodgingDetailInput];
      const name = nameInput.value.trim();
      const errorMsg = document.getElementById('error-msg');
      errorMsg.textContent = '';

      const hasCompanion = selectedValue('has-companion');
      const guestNames = guestNamesInput.value.trim();
      const hasAllergy = selectedValue('has-allergy');
      const allergyDetail = allergyDetailInput.value.trim();
      const needsLodging = selectedValue('needs-lodging');
      const lodgingDetail = lodgingDetailInput.value.trim();
      const invalidFields = [];

      fields.forEach((field) => field.classList.remove('field-error'));
      if (!name) invalidFields.push(nameInput);
      if (!hasCompanion) invalidFields.push(companionSelect);
      if (hasCompanion === '有' && !guestNames) invalidFields.push(guestNamesInput);
      if (!hasAllergy) invalidFields.push(allergySelect);
      if (hasAllergy === '有' && !allergyDetail) invalidFields.push(allergyDetailInput);
      if (!needsLodging) invalidFields.push(lodgingSelect);
      if (needsLodging === '需要' && !lodgingDetail) invalidFields.push(lodgingDetailInput);

      if (invalidFields.length) {
        invalidFields.forEach((field) => field.classList.add('field-error'));
        errorMsg.textContent = '请完整填写标红的问题。';
        invalidFields[0].focus({ preventScroll: true });
        invalidFields[0].scrollIntoView({ behavior: 'smooth', block: 'center' });
        return;
      }

      const btn = document.getElementById('submit-btn');
      btn.textContent = '提交中...';
      btn.disabled = true;

      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 12000);

      try {
        const res = await fetch('/api/rsvp', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name,
            hasCompanion,
            companionNames: guestNames,
            hasDietaryNeed: hasAllergy,
            dietaryDetail: allergyDetail,
            needsLodging,
            lodgingDetail
          }),
          signal: controller.signal
        });
        clearTimeout(timeoutId);

        if (res.ok) {
          document.body.classList.add('is-rsvp-submitted');
          document.getElementById('form-container').style.display = 'none';
          document.getElementById('success-container').style.display = 'block';
        } else {
          let errorDetail = '提交失败';
          try {
            const data = await res.json();
            errorDetail = data.detail || data.error || errorDetail;
          } catch (_) {}
          throw new Error(errorDetail);
        }
      } catch (e) {
        clearTimeout(timeoutId);
        errorMsg.textContent = e.name === 'AbortError'
          ? '提交超时，请稍后再试。'
          : `提交遇到问题：${e.message}`;
        btn.textContent = '确认出席 ♡';
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
