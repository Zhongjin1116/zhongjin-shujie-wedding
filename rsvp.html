<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>回执 — 许忠锦 & 李姝洁婚礼</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Noto+Serif+SC:wght@300;400&family=Noto+Sans+SC:wght@300;400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="rsvp-page">

  <header class="rsvp-header">
    <a href="index.html?state=page3-rsvp" class="back-link" id="rsvp-back-link">← 返回</a>
    <p class="rsvp-header-title">许忠锦 & 李姝洁 · 2026.11.13</p>
  </header>

  <main class="rsvp-main">
    <div class="rsvp-form-wrap">
      <h1 class="form-heading">RSVP</h1>
      <p class="form-sub">感谢您抽空填写，请在 10 月 20 日前提交。</p>

      <div id="form-container">
        <div class="field-group">
          <label class="field-label" for="name">您的姓名 <span class="required">*</span></label>
          <input class="field-input" type="text" id="name" placeholder="请输入您的姓名" />
        </div>

        <div class="field-group">
          <p class="field-label">是否有同行宾客？</p>
          <div class="radio-group" role="radiogroup" aria-label="是否有同行宾客">
            <label class="radio-label">
              <input type="radio" name="has-companion" value="有" />
              有
            </label>
            <label class="radio-label">
              <input type="radio" name="has-companion" value="无" checked />
              无
            </label>
          </div>
        </div>

        <div class="field-group conditional-field" id="companion-detail-group" hidden>
          <label class="field-label" for="guest-names">同行宾客姓名</label>
          <textarea class="field-textarea compact" id="guest-names" placeholder="如有同行宾客，请填写姓名"></textarea>
        </div>

        <div class="field-group">
          <p class="field-label">是否有食物过敏或特殊饮食需求？</p>
          <div class="radio-group" role="radiogroup" aria-label="是否有食物过敏或特殊饮食需求">
            <label class="radio-label">
              <input type="radio" name="has-allergy" value="有" />
              有
            </label>
            <label class="radio-label">
              <input type="radio" name="has-allergy" value="无" checked />
              无
            </label>
          </div>
        </div>

        <div class="field-group conditional-field" id="allergy-detail-group" hidden>
          <label class="field-label" for="allergy-detail">请告诉我们具体的饮食需求</label>
          <textarea class="field-textarea compact" id="allergy-detail" placeholder="如有食物过敏或特殊饮食需求，请在这里说明"></textarea>
        </div>

        <div class="field-group">
          <p class="field-label">是否需要我们安排住宿？</p>
          <div class="radio-group" role="radiogroup" aria-label="是否需要我们安排住宿">
            <label class="radio-label">
              <input type="radio" name="needs-lodging" value="需要" />
              需要
            </label>
            <label class="radio-label">
              <input type="radio" name="needs-lodging" value="不需要" checked />
              不需要
            </label>
          </div>
          <p class="field-help">对于外地宾客，我们可以根据您的行程安排，提供婚礼前后一至两晚的住宿。</p>
        </div>

        <div class="field-group conditional-field" id="lodging-detail-group" hidden>
          <label class="field-label" for="lodging-detail">请填写住宿信息</label>
          <p class="field-help">请告诉我们预计入住人数及入住日期。</p>
          <textarea class="field-textarea compact" id="lodging-detail" placeholder="示例：2 人，11 月 12 日入住，11 月 14 日离店"></textarea>
        </div>

        <button class="submit-btn" id="submit-btn" onclick="submitRsvp()">确认出席 ♡</button>
        <p class="error-msg" id="error-msg"></p>
      </div>

      <!-- Success state -->
      <div id="success-container" style="display:none;" class="success-container">
        <div class="success-icon">✦</div>
        <h2 class="success-heading">感谢您的回复！</h2>
        <p class="success-body">我们已收到您的回执，期待在婚礼上见到您。</p>
        <a href="index.html?state=page3-rsvp" class="back-home-link">← 返回邀请函</a>
      </div>
    </div>
  </main>

  <script>
    function selectedRadioValue(name) {
      return document.querySelector(`input[name="${name}"]:checked`)?.value || '';
    }

    function bindConditionalRadio(name, activeValue, groupId) {
      const group = document.getElementById(groupId);
      if (!group) return;

      const update = () => {
        group.hidden = selectedRadioValue(name) !== activeValue;
      };

      document.querySelectorAll(`input[name="${name}"]`).forEach((input) => {
        input.addEventListener('change', update);
      });
      update();
    }

    bindConditionalRadio('has-companion', '有', 'companion-detail-group');
    bindConditionalRadio('has-allergy', '有', 'allergy-detail-group');
    bindConditionalRadio('needs-lodging', '需要', 'lodging-detail-group');

    async function submitRsvp() {
      const name = document.getElementById('name').value.trim();
      const errorMsg = document.getElementById('error-msg');
      errorMsg.textContent = '';

      if (!name) { errorMsg.textContent = '请填写您的姓名。'; return; }

      const attending = true;
      const hasCompanion = selectedRadioValue('has-companion');
      const guestNames = document.getElementById('guest-names').value.trim();
      const hasAllergy = selectedRadioValue('has-allergy');
      const allergyDetail = document.getElementById('allergy-detail').value.trim();
      const needsLodging = selectedRadioValue('needs-lodging');
      const lodgingDetail = document.getElementById('lodging-detail').value.trim();
      const guestCount = hasCompanion === '有' ? 2 : 1;
      const dietary = `${hasAllergy}${allergyDetail ? `：${allergyDetail}` : ''}`;
      const message = [
        `同行宾客：${hasCompanion}`,
        guestNames ? `同行宾客姓名：${guestNames}` : '',
        `住宿安排：${needsLodging}`,
        lodgingDetail ? `住宿信息：${lodgingDetail}` : '',
      ].filter(Boolean).join('\n');

      const btn = document.getElementById('submit-btn');
      btn.textContent = '提交中...';
      btn.disabled = true;

      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 12000);

      try {
        const res = await fetch('/api/rsvp', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, attending, guestCount, dietary, message }),
          signal: controller.signal
        });
        clearTimeout(timeoutId);

        if (res.ok) {
          document.getElementById('form-container').style.display = 'none';
          document.getElementById('success-container').style.display = 'block';
        } else {
          let errorDetail = '提交失败';
          try {
            const data = await res.json();
            errorDetail = data.detail || data.error || errorDetail;
          } catch (_) {}
          throw new Error(errorDetail);
        }
      } catch (e) {
        clearTimeout(timeoutId);
        errorMsg.textContent = e.name === 'AbortError'
          ? '提交超时，请稍后再试。'
          : `提交遇到问题：${e.message}`;
        btn.textContent = '确认出席 ♡';
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
