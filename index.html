<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>许忠锦 & 李姝洁 — 婚礼邀请</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Noto+Serif+SC:wght@300;400&family=Noto+Sans+SC:wght@300;400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Hero -->
  <section class="hero">
    <video class="hero-video" autoplay muted loop playsinline aria-hidden="true">
      <source src="assets/background.MP4" type="video/mp4" />
    </video>
    <div class="hero-inner">
      <img class="hero-mark" src="assets/asset_1.svg" alt="Zhongjin and Shujie" />
      <p class="hero-date">2025 年 11 月 13 日</p>
      <div class="hero-divider"></div>
      <p class="hero-location">上海 · 太原别墅</p>
    </div>
    <div class="scroll-hint">↓</div>
  </section>

  <!-- Media placeholder -->
  <section class="media-section">
    <div class="media-grid">
      <div class="media-placeholder video-placeholder">
        <span class="placeholder-label">婚礼视频</span>
        <span class="placeholder-sub">即将上传</span>
      </div>
      <div class="media-col">
        <div class="media-placeholder photo-placeholder">
          <span class="placeholder-label">照片</span>
        </div>
        <div class="media-placeholder photo-placeholder">
          <span class="placeholder-label">照片</span>
        </div>
      </div>
    </div>
  </section>

  <!-- Details -->
  <section class="details-section">
    <div class="details-inner">
      <div class="detail-block">
        <p class="detail-label">日期</p>
        <p class="detail-value">2025 年 11 月 13 日</p>
      </div>
      <div class="detail-divider"></div>
      <div class="detail-block">
        <p class="detail-label">地点</p>
        <p class="detail-value">太原别墅</p>
        <p class="detail-sub">上海市</p>
      </div>
      <div class="detail-divider"></div>
      <div class="detail-block">
        <p class="detail-label">时间</p>
        <p class="detail-value">敬请期待</p>
      </div>
    </div>
  </section>

  <!-- RSVP CTA -->
  <section class="rsvp-section">
    <div class="rsvp-inner">
      <p class="rsvp-eyebrow">期待您的出席</p>
      <h2 class="rsvp-heading">请告诉我们您是否能来</h2>
      <p class="rsvp-body">请在 <strong>10 月 31 日</strong>前填写回执，以便我们安排座位和餐饮。</p>
      <a href="rsvp.html" class="rsvp-btn">填写回执 →</a>
    </div>
  </section>

  <footer class="footer">
    <p>许忠锦 & 李姝洁 · 2025</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
