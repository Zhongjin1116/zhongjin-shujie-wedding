<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Wedding Invitation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anonymous+Pro:wght@700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,700;1,300;1,400&family=Noto+Serif+SC:wght@300;400&family=Noto+Sans+SC:wght@300;400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="page-one-only">

  <!-- Hero -->
  <section class="hero">
    <div class="page1-scene" data-node-id="510:547" aria-label="Shujie and Zhongjin">
      <img class="page1-bg" src="assets/figma/page1/background.png" alt="" aria-hidden="true" />
      <div class="page1-title figma-type">
        <span>Shujie</span>
        <span>and</span>
        <span>Zhongjin</span>
      </div>
      <div class="page1-sticker page1-strawberry-top">
        <img src="assets/figma/page1/subject-1.png" alt="" aria-hidden="true" />
      </div>
      <div class="page1-sticker page1-strawberry-left">
        <img src="assets/figma/page1/subject-2.png" alt="" aria-hidden="true" />
      </div>
      <div class="page1-sticker page1-deer">
        <img src="assets/figma/page1/img-6084.png" alt="" aria-hidden="true" />
      </div>
      <div class="page1-sticker page1-butterfly-left">
        <img src="assets/figma/page1/img-6086.png" alt="" aria-hidden="true" />
      </div>
      <div class="page1-sticker page1-butterfly-center">
        <img src="assets/figma/page1/img-6086.png" alt="" aria-hidden="true" />
      </div>
      <div class="page2-scene page2-inline" id="page2-inline" data-node-id="510:574" aria-hidden="true">
        <p class="page2-from figma-type">From 2017</p>
        <div class="page2-camera" data-node-id="548:54">
          <video class="page2-video" muted playsinline loop preload="metadata" data-src="assets/figma/page2/video.mp4" aria-hidden="true"></video>
          <img class="page2-camera-frame" src="assets/figma/page2/camera-frame.png" alt="" aria-hidden="true" />
        </div>
        <div class="page2-locations figma-type" aria-label="Wuhan Birmingham Michigan California Seattle">
          <span>Wuhan</span>
          <span>Birmingham</span>
          <span>Michigan</span>
          <span>California</span>
          <span>Seattle</span>
        </div>
      </div>
      <div class="page3-scene page3-inline" id="page3-inline" data-node-id="510:520" aria-hidden="true">
        <div class="page3-carousel" aria-label="Photo memories">
          <div class="page3-track">
            <figure class="page3-polaroid" style="--i: 0; --tilt: 0deg; --lift: 0px;">
              <img class="page3-slide-photo" src="assets/figma/page3/image1.jpg" alt="Wedding photo 1" />
              <img class="page3-polaroid-frame" src="assets/figma/page3/polaroid-frame.png" alt="" aria-hidden="true" />
            </figure>
            <figure class="page3-polaroid" style="--i: 1; --tilt: 3deg; --lift: 10px;">
              <img class="page3-slide-photo" src="assets/figma/page3/image2.jpg" alt="Wedding photo 2" />
              <img class="page3-polaroid-frame" src="assets/figma/page3/polaroid-frame.png" alt="" aria-hidden="true" />
            </figure>
            <figure class="page3-polaroid" style="--i: 2; --tilt: -3deg; --lift: 10px;">
              <img class="page3-slide-photo" src="assets/figma/page3/image3.jpg" alt="Wedding photo 3" />
              <img class="page3-polaroid-frame" src="assets/figma/page3/polaroid-frame.png" alt="" aria-hidden="true" />
            </figure>
            <figure class="page3-polaroid" style="--i: 3; --tilt: 3deg; --lift: 20px;">
              <img class="page3-slide-photo" src="assets/figma/page3/image4.jpg" alt="Wedding photo 4" />
              <img class="page3-polaroid-frame" src="assets/figma/page3/polaroid-frame.png" alt="" aria-hidden="true" />
            </figure>
            <figure class="page3-polaroid" style="--i: 4; --tilt: -3deg; --lift: 12px;">
              <img class="page3-slide-photo" src="assets/figma/page3/image5.jpg" alt="Wedding photo 5" />
              <img class="page3-polaroid-frame" src="assets/figma/page3/polaroid-frame.png" alt="" aria-hidden="true" />
            </figure>
            <figure class="page3-polaroid" style="--i: 5; --tilt: 3deg; --lift: 18px;">
              <img class="page3-slide-photo" src="assets/figma/page3/image6.jpg" alt="Wedding photo 6" />
              <img class="page3-polaroid-frame" src="assets/figma/page3/polaroid-frame.png" alt="" aria-hidden="true" />
            </figure>
            <figure class="page3-polaroid" style="--i: 6; --tilt: -3deg; --lift: 10px;">
              <img class="page3-slide-photo" src="assets/figma/page3/image7.jpg" alt="Wedding photo 7" />
              <img class="page3-polaroid-frame" src="assets/figma/page3/polaroid-frame.png" alt="" aria-hidden="true" />
            </figure>
            <figure class="page3-polaroid" style="--i: 7; --tilt: 3deg; --lift: 20px;">
              <img class="page3-slide-photo" src="assets/figma/page3/image8.jpg" alt="Wedding photo 8" />
              <img class="page3-polaroid-frame" src="assets/figma/page3/polaroid-frame.png" alt="" aria-hidden="true" />
            </figure>
            <figure class="page3-polaroid" style="--i: 8; --tilt: -3deg; --lift: 10px;">
              <img class="page3-slide-photo" src="assets/figma/page3/image9.jpg" alt="Wedding photo 9" />
              <img class="page3-polaroid-frame" src="assets/figma/page3/polaroid-frame.png" alt="" aria-hidden="true" />
            </figure>
            <figure class="page3-polaroid page3-rsvp-polaroid" style="--i: 9; --tilt: 0deg; --lift: 0px;">
              <div class="page3-rsvp-content figma-type">
                <div class="page3-rsvp-details" aria-hidden="true">
                  <span>2026.11.13</span>
                  <span>Shanghai</span>
                  <span>15:08</span>
                </div>
                <button class="page3-rsvp-link" type="button" data-rsvp-link data-rsvp-href="rsvp.html?from=page3">RSVP</button>
                <small>(Before 2026.10.20)</small>
              </div>
              <img class="page3-rsvp-cat" src="assets/figma/page3/rsvp-cat.png" alt="" aria-hidden="true" />
              <img class="page3-polaroid-frame" src="assets/figma/page3/polaroid-frame.png" alt="" aria-hidden="true" />
            </figure>
          </div>
        </div>
      </div>
      <div class="page-controls page1-controls" data-node-id="548:372" aria-label="Page controls">
        <button class="page-control page-control-back" type="button" aria-label="Back to fog" data-control-action="fog">
          <img src="assets/figma/page1/controls/chevron-left.svg" alt="" aria-hidden="true" />
        </button>
        <button class="page-control music-toggle" type="button" aria-label="Play background music" aria-pressed="false">
          <span class="music-toggle-icon" aria-hidden="true">
            <img src="assets/figma/page1/controls/music.svg" alt="" />
          </span>
        </button>
        <button class="page-control page-control-next" type="button" aria-label="Next page" data-control-action="next" data-target="#page2-inline">
          <img src="assets/figma/page1/controls/chevron-right.svg" alt="" aria-hidden="true" />
        </button>
      </div>
      <canvas class="page1-fog-canvas" aria-hidden="true"></canvas>
    </div>
  </section>

  <section class="figma-section" aria-label="Wedding details">
    <div class="figma-frame">
      <div class="figma-scene page4-scene" data-node-id="428:15778">
        <img class="figma-bg page4-bg" src="assets/figma/page4/background.jpg" alt="" aria-hidden="true" />
        <div class="page4-details figma-type">
          <p>2026.11.13</p>
          <p>Shanghai</p>
          <a href="rsvp.html">RSVP</a>
        </div>
        <img class="page4-deer" src="assets/figma/page4/deer.png" alt="" aria-hidden="true" />
        <img class="page4-flowers" src="assets/figma/page4/flowers.png" alt="" aria-hidden="true" />
        <img class="page4-photo-side" src="assets/figma/page4/photo-side.png" alt="" aria-hidden="true" />
      </div>
    </div>
  </section>

  <audio id="background-music" src="assets/figma/01 always.mp3" loop preload="none"></audio>

  <script src="script.js"></script>
</body>
</html>
